name: Readme.md to [Dokumentation].PDF 
on:

  push:
    branches: 
      - master
    paths:
      - 'resume.md'

jobs:
  checkoutConvertMdToPdfPush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: /
          output_dir: /
          build_html: true
      - run: mv resume.pdf "[Dokumentation] $(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | tr "_" " ").pdf"
      - uses: EndBug/add-and-commit@v7.1.1
        with:
          message: 'generated from resume.md'