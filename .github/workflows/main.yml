name: Readme.md to [Dokumentation].PDF 
on:

  push:
    branches: 
      - master
    paths:
      - 'resume.md'
      - 'images/me.jpg'

jobs:
  checkoutConvertMdToPdfPush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: /
          images_dir: /images/
          images_import: ./images
          output_dir: /
          build_html: false
      - run: mv resume.pdf "$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | tr "_" " ").pdf"
      - uses: EndBug/add-and-commit@v7.1.1
        with:
          message: 'Generated by Github Actions with 💗'